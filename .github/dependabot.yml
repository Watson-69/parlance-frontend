# Dependabot configuration for automated dependency updates
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "Watson-69"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "playwright"
          - "postcss"
          - "tailwindcss"
        update-types:
          - "minor"
          - "patch"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "@vercel/*"
        update-types:
          - "minor"
          - "patch"
      three-ecosystem:
        patterns:
          - "three"
          - "@react-three/*"
          - "@types/three"
        update-types:
          - "minor"
          - "patch"
      mediapipe:
        patterns:
          - "@mediapipe/*"
        update-types:
          - "minor"
          - "patch"